[project]
name = "browser-use-mcp-server"
version = "0.1.0"
description = "MCP server：以本機 Cursor `agent` CLI 作為 browser-use 的 LLM 後端（透過子行程），供 Cursor 等 MCP 用戶端呼叫瀏覽器自動化。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "browser-use>=0.12.6",
    "mcp>=1.26.0",
]

[project.scripts]
browser-use-cursor-mcp = "browser_use_cursor_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["browser_use_cursor_mcp"]
